modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/Stevv63/NoMindlessShooting/issues/"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL = "https://github.com/Stevv63/NoMindlessShooting/"
authors = "${mod_authors}"
displayTest = "IGNORE_SERVER_VERSION"
description = '''${mod_description}'''

[[dependencies."${mod_id}"]]
modId = "forge"
mandatory = true
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "SERVER"

[[dependencies."${mod_id}"]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "SERVER"

[[dependencies."${mod_id}"]]
modId = "tacz"
mandatory = true
versionRange = "[1.0.3,)"
ordering = "AFTER"
side = "SERVER"

[[dependencies."${mod_id}"]]
modId = "hordes"
mandatory = false
versionRange = "[1.5.4,)"
ordering = "AFTER"
side = "SERVER"